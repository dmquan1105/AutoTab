[project]
name = "autotab"
version = "0.1.0"
description = "Grounded spreadsheet exploration"
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1",
    "pandas>=2.2",
    "PyYAML>=6.0",
    "Pillow>=10.0",
    "pypdfium2>=4.30.0",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "black>=24", "isort>=5", "mypy>=1.10"]

[project.scripts]
autotab = "autotab.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autotab"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
ignore_missing_imports = true
